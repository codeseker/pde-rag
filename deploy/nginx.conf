# Main nginx configuration for the single-image deployment.
# Serves the built React app and reverse-proxies the API to the NestJS
# backend that runs inside the same container.

user root;
worker_processes 1;
worker_rlimit_nofile 2048;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # upstream_* fields make a 502 immediately distinguishable from an
  # application-level 500/503 in the Render logs.
  log_format main '$remote_addr - $request_id [$time_local] "$request" $status '
                  '$body_bytes_sent upstream=$upstream_addr upstream_status=$upstream_status '
                  'request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  reset_timedout_connection on;
  server_tokens off;

  # Temp paths must be writable in a container.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  include /etc/nginx/conf.d/*.conf;
}
