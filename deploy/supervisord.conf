[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root
minfds=2048
minprocs=200

[program:verifier]
command=/opt/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000 --workers 1 --log-level info
directory=/app/verifier
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=10
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/usr/local/bin/node dist/main.js
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=20
; The public port belongs to nginx; the API always listens on 3000 internally.
; DATABASE_URL and the provider keys are inherited from the container.
environment=PORT="3000",NODE_ENV="production",VERIFIER_URL="http://127.0.0.1:8000",NODE_OPTIONS="--max-old-space-size=384"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
